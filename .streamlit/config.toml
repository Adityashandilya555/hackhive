[browser]
# No usage statistics leave our laptops (Streamlit sends them by default).
gatherUsageStats = false

[theme]
base = "dark"
# slate, not cream: Streamlit fills a toggle, checkbox and multiselect tag with it and puts
# light text on top (cream made them vanish); the cream chips are set in theme.CSS
primaryColor = "#6D8196"
backgroundColor = "#4A4A4A"
secondaryBackgroundColor = "#3A3A3A"
textColor = "#FFFFE3"
font = "sans serif"
# :green[] :orange[] :red[] text (the reviewer checklist, on the cream card): the kit's ink tokens
greenTextColor = "#262626"
orangeTextColor = "#5A5A5A"
redTextColor = "#B4483A"
